name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y util-linux
          test -c /dev/net/tun || sudo modprobe tun
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: bash tests/installer.sh
      - run: bash tests/smoke.sh "$PWD/target/debug/hku"
      - run: bash tests/connection.sh "$PWD/target/debug/hku"
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect vpnc-scripts iproute2 iptables util-linux
          # Hosted runners make /usr/share writable through an ACL. The daemon
          # deliberately rejects that privilege boundary; harden this test VM.
          sudo setfacl -b /usr/share
          sudo chmod 755 /usr/share
          test -c /dev/net/tun || sudo modprobe tun
          rustup update stable
          rustup default stable
      - run: cargo build --locked
      - run: bash tests/native.sh "$PWD/target/debug/hku"
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native static toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools iproute2 iptables util-linux
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build embedded OpenConnect and corresponding sources
        run: |
          bash scripts/build-runtime.sh "$PWD/target/openconnect-runtime"
          echo "HKU_OPENCONNECT_BUNDLE=$PWD/target/openconnect-runtime/runtime.tar.gz" >> "$GITHUB_ENV"
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Test bundled native runtime without host VPN packages
        env:
          HKU_TEST_RUNTIME: ${{ github.workspace }}/target/openconnect-runtime/runtime.tar.gz
          HKU_TEST_MOCK: ${{ github.workspace }}/target/openconnect-runtime/mock-openconnect
        run: bash tests/native.sh "$PWD/target/${{ matrix.target }}/release/hku"
      - name: Package binary
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import sys,json; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          test "$(target/${{ matrix.target }}/release/hku --version)" = "hku $version"
          mkdir -p dist
          tar -czf "dist/hku-v$version-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release hku
          cp target/openconnect-runtime/runtime-sources.tar.gz "dist/hku-v$version-runtime-sources-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hku-${{ matrix.target }}
          path: |
            dist/hku-v*-${{ matrix.target }}.tar.gz
            !dist/*-runtime-sources-*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hku-runtime-sources-${{ matrix.target }}
          path: dist/*-runtime-sources-*.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Windows client
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./tests/installer.ps1 -Binary (Resolve-Path target/release/hku.exe)
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($env:GITHUB_REF -like 'refs/tags/*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          New-Item -ItemType Directory -Path dist
          Compress-Archive -LiteralPath target/release/hku.exe -DestinationPath "dist/hku-v$version-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hku-x86_64-pc-windows-msvc
          path: dist/*.zip
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup update stable && rustup default stable
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Package client
        run: |
          version=$(target/release/hku --version | cut -d ' ' -f 2)
          mkdir -p dist
          tar -czf "dist/hku-v$version-${{ matrix.target }}.tar.gz" -C target/release hku
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: hku-${{ matrix.target }}
          path: dist/*.tar.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, native, build, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: hku-*
          merge-multiple: true
          path: dist
      - name: Publish verified binaries and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
          (cd dist && sha256sum *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "hku $GITHUB_REF_NAME" --notes-file docs/release-notes.md
