[package]
name = "hku-gateway"
version = "0.1.2"
edition = "2021"
description = "Isolated HKU VPN gateway for SSH and TCP forwarding"
repository = "https://github.com/adlsdztony/hku-ssh-gateway"
publish = false

[[bin]]
name = "hku"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", features = ["term", "process", "signal", "user", "socket", "fs"] }
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
